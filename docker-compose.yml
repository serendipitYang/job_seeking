version: '3.8'

services:
  job-search:
    build: .
    volumes:
      # Mount resumes and config for access
      - ./resume.docx:/app/resume.docx:ro
      - ./fulltime.local.json:/app/fulltime.local.json:ro
      # Mount output directory for results
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: python run_job_search.py
